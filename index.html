<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teen Strong Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #131313;
    --panel: #1b1b1b;
    --ink: #f4f4f1;
    --muted: #a9a9a2;
    --line: #333330;
    --accent: #f2c21b;
    --zebra: #202020;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    --body: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    padding: 20px clamp(12px, 3vw, 40px);
    gap: 14px;
  }
  header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-rows: auto auto;
    align-items: center;
    gap: 16px 0px;
  }
  .brand { font-family: var(--display); text-transform: uppercase; line-height: 1; }
  .brand .big { font-size: clamp(2.4rem, 6vw, 6rem); letter-spacing: 0.01em; }
  .brand .sub { color: var(--accent); font-size: clamp(1.6rem, 3vw, 3rem); margin-left: 10px; }
  .header-logos {
    display: grid;
    grid-column: 2;
    grid-row: 1 / span 2;
    grid-template-rows: repeat(2, clamp(48px, 6.8vw, 82px));
    grid-auto-flow: column;
    align-items: center;
    column-gap: clamp(16px, 2.5vw, 32px);
  }
  .header-logos svg,
  .header-logos img,
  .title-row #status img {
    display: block;
    width: auto;
    height: clamp(48px, 6.8vw, 82px);
    max-width: 24vw;
    object-fit: contain;
  }
  .header-logos .nápisslogem-logo { order: 4;
    transform: translateX(-55px) translateY(25px) scale(0.76);
  }
  .header-logos .nutrend-logo { order: 1; }
  .header-logos .regional-logo { order: 2;
    transform: translateX(58px) translateY(25px) scale(1.555);
  }
  .header-logos .cafekitchen-logo { order: 3; }
  .header-logos .legends-gym-logo { order: 5; }
  .nápisslogem-logo svg { display: none; }
  .header-logos .legends-gym-logo svg,
  .legends-gym-logo svg {
    display: block;
    width: clamp(72px, 10vw, 130px);
    height: 100%;
    max-width: none;
    transform: translateX(-40px) translateY(19px) scale(1);
  }
  .title-row {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .legends-gym-logo { grid-column: 3; grid-row: 1 / span 2; align-self: stretch; }
  .title-row h1 { line-height: 1; }
  .title-row #status { display: flex; align-items: center; gap: 30px; }
  .title-row #status .nápisslogem-logo { order: 1; }
  .title-row #status .cafekitchen-logo { order: 2; }
  @media (max-width: 760px) {
    header { grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; }
    .header-logos { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
    .title-row { grid-column: 1 / -1; grid-row: 3; }
    .legends-gym-logo { grid-column: 2; grid-row: 1 / span 3; }
    .title-row #status { font-size: 0.9rem; }
  }
  .legends-gym-logo {
    margin-right: 0;
    padding-right: 0;
    border-right: 0;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    text-transform: uppercase;
    color: var(--accent);
    font-size: clamp(1.6rem, 3.5vw, 2.6rem);
    letter-spacing: 0.02em;
  }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  nav button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 6px 18px;
    border-radius: 999px;
    font: 600 1.1rem var(--body);
    cursor: pointer;
  }
  nav button[aria-current="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #111;
    font-weight: 700;
  }
  nav button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); }
  main {
    flex: 1;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .table-static { flex: 0 0 auto; }
  .table-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .table-scroll::-webkit-scrollbar { display: none; }
  table { border-collapse: collapse; table-layout: fixed; width: 100%; font-size: clamp(1.1rem, 2vw, 1.7rem); font-weight: 500; }
  th, td { padding: 6px 18px; text-align: left; border-bottom: 1px solid var(--line); }
  th {
    position: sticky; top: 0;
    background: #0d0d0d;
    color: var(--accent);
    font-family: var(--display);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 2px solid var(--accent);
  }
  tbody tr:nth-child(even) { background: var(--zebra); }
  .msg { padding: 40px; color: var(--muted); font-size: 1.4rem; }
  @media (prefers-reduced-motion: reduce) { #bar { transition: none !important; } }
</style>

</head>

<script>

/* =========================
 Configuration
 ========================= */
const CONFIG = {
  SHEET_ID: "1iu8-SqWYMZ1WD7EwTvI3lS9zUIzM_gcY57le3eqHpaI",

};

const DISCIPLINES = [
  { name: "Bench press", key: "bench press", unit: "opak." },
  { name: "Mrtvý tah", key: "mrtvý tah", unit: "opak." },
  { name: "Dřep", key: "dřep", unit: "opak." },

];

/* =========================

   ========================= */
const getElement = (id) => document.getElementById(id);

// These values are updated as data loads and as the automatic presentation advances.
let people = null;

let switchTimer = null;

let refreshInterval = null;

/* =========================
   Data parsing and loading
   ========================= */
function parseCSV(text) {
  // A small CSV parser is used instead of split(",") because cells may contain
  // commas, quoted text, or line breaks.
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const character = text[i];

    if (inQuotes) {
      if (character === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (character === '"') {
        inQuotes = false;
      } else {
        cell += character;
      }
    } else if (character === '"') {
      inQuotes = true;
    } else if (character === ",") {
      row.push(cell);
      cell = "";
    } else if (character === "\n" || character === "\r") {
      if (character === "\r" && text[i + 1] === "\n") {
        i++;
      }
      row.push(cell);
      cell = "";
      rows.push(row);
      row = [];
    } else {
        cell += character;
    }
  }

  if (cell !== "" || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function parseNumber(value) {
  const number = parseFloat(
    String(value || "").replace(/\s/g, "").replace(",", ".")
  );
  return isNaN(number) ? 0 : number;
}

function formatNumber(number) {
  return (Math.round(number * 10) / 10).toString().replace(".", ",");
}

function normalize(value) {
  return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
}

async function fetchRows(queryParameters) {
  const url =
    `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}` +
    `/gviz/tq?tqx=out:csv&headers=0${queryParameters}&_=${Date.now()}`;

  console.log(url);
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error("HTTP " + response.status);

  const text = await response.text();
  if (text.trim().startsWith("<")) {
    throw new Error(
        "Google chce přihlášení – tabulka není sdílená přes odkaz"
    );
  }

  return parseCSV(text);
}

const FIXED_COLUMNS = {
  name: 1,
  school: 2,
  total: 15,
  disciplines: {
    "bench press": [5, 6],
    "mrtvý tah": [7, 8],
    "dřep": [9, 10],
    "shyby": [11, 12],
    "trojskok": [13, 14]
  }
};

function parseFixed(rows) {
  // Fallback for sheets whose header row cannot be detected. These indexes
  // match the fixed layout of the "Zadávání" sheet.
  const data = rows.filter(r => /^\d+$/.test((r[0] || "").trim()));
  if (!data.length) return null;

  return data.map(r => {
    const person = {
      name: (r[FIXED_COLUMNS.name] || "").trim(),
      school: (r[FIXED_COLUMNS.school] || "").trim(),
      total: parseNumber(r[FIXED_COLUMNS.total]),
      disciplines: {}
    };

    DISCIPLINES.forEach(d => {
      const [performanceColumn, pointsColumn] =
        FIXED_COLUMNS.disciplines[d.key];
      person.disciplines[d.key] = {
        performance: parseNumber(r[performanceColumn]),
        points: parseNumber(r[pointsColumn])
      };
    });

    return person;
  }).filter(person => person.name || person.total > 0);
}

function parsePeople(rows) {
  // Prefer column names so the display keeps working if the sheet is reordered.
  const headerIndex = rows.findIndex(row =>
    row.some(cell => normalize(cell).includes("body celkem"))
  );
  if (headerIndex < 0) return parseFixed(rows);

  const headers = rows[headerIndex].map(normalize);
  const findColumn = (test) => headers.findIndex(test);
  const nameColumn = findColumn(header => header.includes("jméno"));
  const schoolColumn = findColumn(
    header => header === "škola" || header.includes("škola")
  );
  const totalColumn = findColumn(header => header.includes("body celkem"));
  const disciplineColumns = {};

  DISCIPLINES.forEach(d => {
    disciplineColumns[d.key] = {
      performance: findColumn(
        header => header.includes(d.key) && header.includes("výkon")
      ),
      points: findColumn(
        header => header.includes(d.key) && header.includes("body")
      )
    };
  });

  const getCell = (row, column) =>
    column >= 0 ? (row[column] || "").trim() : "";

  return rows
    .slice(headerIndex + 1)
    .map(row => {
      const person = {
        name: getCell(row, nameColumn),
        school: getCell(row, schoolColumn),
        total: parseNumber(getCell(row, totalColumn)),
        disciplines: {}
      };

      DISCIPLINES.forEach(discipline => {
        const columns = disciplineColumns[discipline.key];
        person.disciplines[discipline.key] = {
          performance: parseNumber(getCell(row, columns.performance)),
          points: parseNumber(getCell(row, columns.points))
        };
      });

      return person;
    })
    .filter(person => person.name || person.total > 0);
}

async function load() {
  const queryAttempts = [
    `&sheet=${encodeURIComponent(CONFIG.TAB)}`,
    ``,
    `&gid=0`
  ];

  let lastRows = null;
  let errorMessage = "";

  for (const queryParameters of queryAttempts) {
    try {
      const rows = await fetchRows(queryParameters);
      lastRows = rows;
      const parsedPeople = parsePeople(rows);
      if (parsedPeople) {
        people = parsedPeople;
        return;
      }
    } catch (error) {
      errorMessage = error.message;
    }
  }

  if (lastRows) {
    const preview = lastRows
      .slice(0, 4)
      .map(row => row.slice(0, 8).join(" | "))
      .join("  //  ");
    throw new Error(
      'Záhlaví "Body celkem" nenalezeno. Načtený list začíná: ' +
      preview.slice(0, 300)
    );
  }

  throw new Error(errorMessage || "Data se nepodařilo načíst");
}

function rankRows(items, getValue) {
  // Sorting mutates the supplied array, but each caller passes a new filtered
  // array, so the loaded source data remains unchanged.
  items.sort((a, b) => getValue(b) - getValue(a));

  let rank = 0;
  let previousValue = null;
  return items.map((item, index) => {
    const value = getValue(item);
    if (value !== previousValue) {
      rank = index + 1;
      previousValue = value;
    }
    return { rank, item };
  });
}

const VIEWS = [
  {
    name: "Celkové pořadí",
    build: () => ({
      head: ["Pořadí", "Jméno a příjmení", "Škola", "Body celkem"],
      rows: rankRows(
        people.filter(person => person.total > 0),
        person => person.total
      ).map(({ rank, item }) => [
        rank + ".",
        item.name || "—",
        item.school,
        formatNumber(item.total)
      ])
    })
  },
  ...DISCIPLINES.map(discipline => ({
    name: discipline.name,
    build: () => ({
      head: [
        "Pořadí",
        "Jméno a příjmení",
        "Škola",
        `Výkon (${discipline.unit})`,
        "Body"
      ],
      rows: rankRows(
        people.filter(
          person => person.disciplines[discipline.key].performance > 0
        ),
        person => person.disciplines[discipline.key].performance
      ).map(({ rank, item }) => {
        const result = item.disciplines[discipline.key];
        return [
          rank + ".",
          item.name || "—",
          item.school,
          formatNumber(result.performance),
          formatNumber(result.points)
        ];
      })
    })
  })),
  {
    name: "Družstva",
    build: () => {
      const teams = {};
      people.filter(person => person.school).forEach(person => {
        const team = teams[person.school] || {
          school: person.school,
          total: 0,
          count: 0
        };
        team.total += person.total;
        team.count += 1;
        teams[person.school] = team;
      });

      const teamList = Object.values(teams).filter(team => team.total > 0);
      return {
        head: ["Pořadí", "Škola", "Body družstva"],
        rows: rankRows(teamList, team => team.total).map(({ rank, item }) => [
          rank + ".",
          item.school,
          formatNumber(item.total)
        ])
      };
    }
  }
];

const escapeHtml = (value) =>
  String(value).replace(
    /[&<>"]/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;"
    }[character])
  );

function renderColgroup(head, rows) {
  // Both table sections receive the same <colgroup>; widths are based on the
  // longest header or cell value so their columns line up.
  const lengths = head.map((label, columnIndex) =>
    Math.max(
      String(label).length,
      ...rows.map(row => String(row[columnIndex] || "").length)
    )
  );
  const weights = lengths.map(length => Math.min(Math.max(length, 4), 30));
  const total = weights.reduce((sum, weight) => sum + weight, 0);
  return (
    "<colgroup>" +
    weights
      .map(weight => `<col style="width:${(weight / total * 100).toFixed(2)}%">`)
      .join("") +
    "</colgroup>"
  );
}

function render() {
  const viewDefinition = VIEWS[current];
  getElement("title").textContent = viewDefinition.name;
  document.querySelectorAll("#tabs button").forEach((b, i) =>
    b.setAttribute("aria-current", i === current ? "true" : "false")
  );

  const view = getElement("view");
  if (!people) {
    view.innerHTML =
      '<div class="msg">Data nejsou k dispozici.<br>' +
      escapeHtml(lastError || "Načítám…") +
      "</div>";
    return;
  }

  const { head, rows: allRows } = viewDefinition.build();
  const rows = allRows;
  if (!rows.length) {
    view.innerHTML = '<div class="msg">Zatím nejsou zadané žádné výsledky.</div>';
    return;
  }

  const renderRows = (tableRows) =>
    tableRows
      .map(row =>
        "<tr>" +
        row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("") +
        "</tr>"
      )
      .join("");

  const staticRows = rows.slice(0, 5);
  const scrollingRows = rows.slice(5);
  const colgroup = renderColgroup(head, rows);
  const headerCells = head
    .map(header => `<th>${escapeHtml(header)}</th>`)
    .join("");
  const staticTable =
    '<div class="table-static"><table>' +
    colgroup +
    "<thead><tr>" +
    headerCells +
    "</tr></thead><tbody>" +
    renderRows(staticRows) +
    "</tbody></table></div>";
  const scrollingTable = scrollingRows.length
    ? '<div class="table-scroll"><table>' +
      colgroup +
      "<tbody>" +
      renderRows(scrollingRows) +
      "</tbody></table></div>"
    : "";

  view.innerHTML = staticTable + scrollingTable;
}

function startAutoScroll(duration) {
  // The first five rows are outside .table-scroll and therefore stay visible.
  // Only the remaining rows are animated.
  cancelAnimationFrame(scrollFrame);
  clearTimeout(scrollStartTimer);
  scrollFrame = null;
  scrollStartTimer = null;
  const view = document.querySelector("#view .table-scroll");
  if (!view) return;
  view.scrollTop = 0;
  const distance = view.scrollHeight - view.clientHeight;
  if (distance <= 0 || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const delay = CONFIG.AUTO_SCROLL_DELAY_SECONDS * 1000;
  scrollStartTimer = setTimeout(() => {
    const started = performance.now();
    const step = (now) => {
      const progress =
        duration === 0 ? 1 : Math.min((now - started) / duration, 1);
      view.scrollTop = distance * progress;
      if (progress < 1) scrollFrame = requestAnimationFrame(step);
    };
    scrollFrame = requestAnimationFrame(step);
  }, delay);
}

function getScrollDuration() {
  return Math.max(
    CONFIG.SWITCH_SECONDS -
      CONFIG.AUTO_SCROLL_DELAY_SECONDS -
      CONFIG.AUTO_SCROLL_END_DELAY_SECONDS,
    0
  ) * 1000;
}

async function refreshAll() {
  try {
    await load();
  } catch (error) {
    lastError = error.message;
    console.error(error);
  }

  render();
  startAutoScroll(getScrollDuration());
}

function scheduleRefreshes() {
  clearTimeout(refreshStartTimer);
  clearInterval(refreshInterval);

  refreshStartTimer = setTimeout(() => {
    refreshAll();
    refreshInterval = setInterval(
      refreshAll,
      CONFIG.REFRESH_SECONDS * 1000
    );
  }, CONFIG.REFRESH_INITIAL_DELAY_SECONDS * 1000);
}

function startProgress() {
  const bar = getElement("bar");
  bar.style.transition = "none";
  bar.style.width = "0";
  void bar.offsetWidth;
  bar.style.transition = `width ${CONFIG.SWITCH_SECONDS}s linear`;
  bar.style.width = "100%";
}

function show(i) {
  current = (i + VIEWS.length) % VIEWS.length;
  render();
  startProgress();
  clearTimeout(switchTimer);
  // Each view is divided into: top pause, scrolling, and bottom pause.
  startAutoScroll(getScrollDuration());
  scheduleRefreshes();
  switchTimer = setTimeout(() => show(current + 1), CONFIG.SWITCH_SECONDS * 1000);
}

function init() {
  const navigation = getElement("tabs");
  VIEWS.forEach((view, index) => {
    const b = document.createElement("button");
    b.textContent = view.name;
    b.onclick = () => show(index);
    navigation.appendChild(b);
  });
  refreshAll().then(() => show(0));
}

init();
</script>
</body>
